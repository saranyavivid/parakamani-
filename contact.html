<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Parakamani Coldpress Oils</title>
    <style>
        /* Light Rustwood Theme */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #FAF3E0; color: #4A3022; }
        header { background-color: #B06D4D; color: #FFFFFF; padding: 40px 20px; text-align: center; border-bottom: 4px solid #8A4522; }
        header h1 { margin: 0; font-size: 2.8em; letter-spacing: 1px; }
        header p { font-size: 1.2em; color: #FDEBD0; margin-top: 10px; }
        nav { background-color: #FFFFFF; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        nav a { color: #4A3022; text-decoration: none; margin: 0 20px; font-size: 1.1em; font-weight: bold; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: #B06D4D; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        /* Contact Form Styling */
        .contact-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-top: 4px solid #B06D4D;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #8A4522; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #D08856;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #8A4522;
            box-shadow: 0 0 5px rgba(176, 109, 77, 0.3);
        }
        .btn {
            display: inline-block;
            background-color: #B06D4D;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1em;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover { background-color: #8A4522; transform: scale(1.02); }

        footer { background-color: #8A4522; color: #FAF3E0; text-align: center; padding: 30px 0; margin-top: 60px; }
        /* Mobile Responsiveness for Phones */
        @media (max-width: 768px) {
            nav { padding: 10px; }
            nav a { display: block; margin: 12px 0; font-size: 1.2em; }
            .recipe-grid { flex-direction: column; align-items: center; }
            .recipe-card { width: 100%; max-width: 350px; }
            header h1 { font-size: 2.2em; }
            .hero { padding: 40px 15px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Parakamani Coldpress Oils</h1>
        <p>100% Pure, Traditional, Wood-Pressed</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Our Oils</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <div class="container">
        <h2 style="text-align: center; color: #8A4522; font-size: 2.5em; margin-bottom: 10px;">Get in Touch</h2>
        <p style="text-align: center; margin-bottom: 40px;">Have questions about our wood-pressing process or bulk orders? Send us a message!</p>
        
        <div class="contact-box">
            <form onsubmit="alert('Thank you for reaching out! Your message has been sent to the Parakamani team.'); return false;">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="Enter your mobile number">
                </div>
                <div class="form-group">
                    <label for="message">Your Message or Inquiry</label>
                    <textarea id="message" rows="5" required placeholder="Tell us what you need..."></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Parakamani Coldpress Oils. Built with love.</p>
        <p>Amaravati, AP</p>
    </footer>
</body>
</html>
